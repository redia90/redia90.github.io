name: Deploy Quartz site to Cloudflare Workers

on:
  push:
    branches:
      - v4
  workflow_dispatch:

env:
  QUARTZ_BASE_URL: ${{ vars.QUARTZ_BASE_URL || 'wiki.breast-cancer.workers.dev' }}

permissions:
  contents: read

concurrency:
  group: "cloudflare-workers"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-22.04
    environment:
      name: cloudflare-workers
      url: ${{ steps.deploy.outputs.deployment-url }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        run: npm ci

      - name: Capture Current Deployed Content Index
        run: |
          curl -fsSL "https://${QUARTZ_BASE_URL}/static/contentIndex.json" \
            -o /tmp/previous-contentIndex.json || echo '{}' > /tmp/previous-contentIndex.json

      - name: Build Quartz
        run: npx quartz build

      - name: Detect New Content
        id: new_content
        run: |
          node scripts/detect-new-content.mjs \
            /tmp/previous-contentIndex.json \
            public/static/contentIndex.json \
            /tmp/push-notification.json >> "$GITHUB_OUTPUT"

      - name: Prepare Cloudflare KV Binding
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          find_namespace_id() {
            npx wrangler@4 kv namespace list | node -e '
              const fs = require("fs")
              const namespaces = JSON.parse(fs.readFileSync(0, "utf8"))
              const namespace = namespaces.find((item) =>
                item.title === "wiki-PUSH_SUBSCRIPTIONS" ||
                item.title === "PUSH_SUBSCRIPTIONS" ||
                item.title.endsWith("-PUSH_SUBSCRIPTIONS")
              )
              if (namespace) process.stdout.write(namespace.id)
            '
          }

          namespace_id="$(find_namespace_id)"
          if [ -z "$namespace_id" ]; then
            npx wrangler@4 kv namespace create PUSH_SUBSCRIPTIONS
            namespace_id="$(find_namespace_id)"
          fi

          if [ -z "$namespace_id" ]; then
            echo "Failed to resolve PUSH_SUBSCRIPTIONS KV namespace id" >&2
            exit 1
          fi

          node scripts/prepare-cloudflare-config.mjs "$namespace_id"

      - name: Configure Worker Secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VAPID_PRIVATE_JWK: ${{ secrets.VAPID_PRIVATE_JWK }}
          PUSH_NOTIFY_SECRET: ${{ secrets.PUSH_NOTIFY_SECRET }}
        run: |
          printf '%s' "$VAPID_PRIVATE_JWK" | npx wrangler@4 secret put VAPID_PRIVATE_JWK --config wrangler.generated.jsonc
          printf '%s' "$PUSH_NOTIFY_SECRET" | npx wrangler@4 secret put PUSH_NOTIFY_SECRET --config wrangler.generated.jsonc

      - name: Deploy to Cloudflare Workers
        id: deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4"
          command: deploy --config wrangler.generated.jsonc
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Notify PWA Subscribers
        if: steps.new_content.outputs.has_new == 'true'
        env:
          PUSH_NOTIFY_SECRET: ${{ secrets.PUSH_NOTIFY_SECRET }}
        run: |
          curl -fsSL -X POST "https://${QUARTZ_BASE_URL}/api/push/notify" \
            -H "Authorization: Bearer ${PUSH_NOTIFY_SECRET}" \
            -H "Content-Type: application/json" \
            --data-binary @/tmp/push-notification.json
