<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta http-equiv="refresh" content="0; url=https://wiki.breast-cancer.workers.dev/" />
    <link rel="canonical" href="https://wiki.breast-cancer.workers.dev/" />
    <title>유방암 위키로 이동합니다</title>
    <script>
      ;(() => {
        const target = new URL("https://wiki.breast-cancer.workers.dev")
        target.pathname = window.location.pathname
        target.search = window.location.search
        target.hash = window.location.hash
        window.location.replace(target.toString())
      })()
    </script>
  </head>
  <body>
    <p>
      유방암 위키가
      <a href="https://wiki.breast-cancer.workers.dev/">https://wiki.breast-cancer.workers.dev/</a>
      로 이동했습니다.
    </p>
  </body>
</html>
